# Genera un APK de prueba de CheckHome en un runner de GitHub.
# Costo cero: el repo es público, y en repos públicos los runners estándar de GitHub Actions son gratis.
# Corre en cada PR que toque app/ (así cada cambio trae su APK para probar) y también a mano
# (pestaña Actions → "APK de prueba" → Run workflow).
# El APK queda como artefacto del run por 14 días. Está firmado con la clave de depuración: sirve para
# instalar y probar, no para publicar en la Play Store.
name: APK de prueba

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/apk-prueba.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: checkhome-${{ github.sha }}
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
