<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: en el iPhone instalado la app usa toda la pantalla y respeta la muesca con safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>CheckHome</title>
    <!-- Versión web instalable (PWA): en el iPhone, Safari → Compartir → "Agregar a pantalla de inicio" -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CheckHome" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1211" media="(prefers-color-scheme: dark)" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #F7F6F3;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0F1211;
        }
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>CheckHome necesita JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
